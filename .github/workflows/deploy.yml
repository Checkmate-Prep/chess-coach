name: Deploy to Cloudflare

# One Worker per environment (see wrangler.toml). Each job reads its secrets from the GitHub
# Environment with the same name: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until those are set, the job skips the deploy instead of failing (the app still deploys to GitHub Pages).
on:
  push:
    branches: [main, dev]
    paths: ["app/**", "worker/**", "wrangler.toml", "package.json", "package-lock.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, test, production]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'dev') }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'dev') }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN in this GitHub Environment yet, so nothing was deployed to Cloudflare. See README (Accounts and sync)."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci && npm test
      - if: env.HAS_TOKEN == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'dev') }}
