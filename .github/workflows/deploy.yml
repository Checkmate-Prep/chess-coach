name: Deploy to Cloudflare

# One Worker per environment (see wrangler.toml). Each job reads its secrets from the GitHub
# Environment with the same name: the secrets CLOUDFLARE_API_TOKEN and ANTHROPIC_API_KEY (AI prep; optional: without it
# the Worker deploys and the app hides AI prep),
# and CLOUDFLARE_ACCOUNT_ID (a variable, since it isn't secret; a secret of that name works too).
# Until those are set, the job skips the deploy instead of failing (the app still deploys to GitHub Pages).
# Production also deploys the Auth0 Action that notifies new sign-ups (ops/auth0/), once the environment has
# the secrets AUTH0_MGMT_CLIENT_SECRET and NTFY_TOPIC, and AUTH0_MGMT_CLIENT_ID (a variable, since it isn't
# secret; a secret of that name works too). See README.
# Where each run goes: a push to main deploys production; each push to an open pull request from this repository
# deploys that PR to dev (dev.checkmateprep.com shows whichever PR pushed last); test, or any branch, by hand.
on:
  push:
    branches: [main]
    paths: ["app/**", "worker/**", "ops/**", "wrangler.toml", "package.json", "package-lock.json", ".github/workflows/deploy.yml"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["app/**", "worker/**", "ops/**", "wrangler.toml", "package.json", "package-lock.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, test, production]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || (github.event_name == 'push' && 'production' || 'dev') }}
  cancel-in-progress: false

jobs:
  deploy:
    # pull requests from forks get no secrets: nothing to deploy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (github.event_name == 'push' && 'production' || 'dev') }}
      url: ${{ steps.url.outputs.url }}
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_AUTH0_MGMT: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET != '' }}
      HAS_AI_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      TARGET: ${{ github.event.inputs.environment || (github.event_name == 'push' && 'production' || 'dev') }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN in this GitHub Environment yet, so nothing was deployed to Cloudflare. See README (Accounts and sync)."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci && npm test
      - if: env.HAS_TOKEN == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ github.event.inputs.environment || (github.event_name == 'push' && 'production' || 'dev') }}
          # upload the key only when this environment has one (the action fails on a secret it can't find)
          secrets: ${{ env.HAS_AI_KEY == 'true' && 'ANTHROPIC_API_KEY' || '' }}
      # The shared game store (worker/games.js) keeps each file 180 days at most (ops/r2/games-lifecycle.json).
      # `set` replaces the bucket's rules, so running it on every deploy is harmless. Deploying created the bucket.
      - if: env.HAS_TOKEN == 'true'
        name: Expire the game store after 180 days
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$TARGET" in production) bucket=chess-coach-games-prod ;; *) bucket="chess-coach-games-$TARGET" ;; esac
          npx wrangler r2 bucket lifecycle set "$bucket" --file ops/r2/games-lifecycle.json --force \
            || echo "::warning::Couldn't set the game store's 180-day rule on $bucket. The API token needs R2 edit access. See README (Game store)."
      - if: env.HAS_TOKEN == 'true' && env.HAS_AI_KEY != 'true'
        run: echo "::notice::No ANTHROPIC_API_KEY in this GitHub Environment, so AI prep stays off here (the app shows the quick plan). See README (AI-written prep)."
      # The environment's link on GitHub. Wrangler reports a custom domain as "checkmateprep.com (custom domain)",
      # which GitHub rejects as a URL: keep the address and add https:// (a workers.dev address already has it).
      - if: env.HAS_TOKEN == 'true'
        id: url
        env:
          DEPLOYED: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          u="${DEPLOYED%% *}"
          case "$u" in http*|'') ;; *) u="https://$u" ;; esac
          echo "url=$u" >> "$GITHUB_OUTPUT"
      - if: env.HAS_TOKEN == 'true' && env.TARGET == 'production' && env.HAS_AUTH0_MGMT != 'true'
        run: echo "::notice::No AUTH0_MGMT_CLIENT_SECRET in the production GitHub Environment, so the sign-up notification Action wasn't deployed. See README (Monitoring)."
      - if: env.HAS_TOKEN == 'true' && env.TARGET == 'production' && env.HAS_AUTH0_MGMT == 'true'
        name: Deploy the Auth0 sign-up notification
        run: node ops/auth0/deploy-actions.mjs
        env:
          AUTH0_MGMT_CLIENT_ID: ${{ vars.AUTH0_MGMT_CLIENT_ID || secrets.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
