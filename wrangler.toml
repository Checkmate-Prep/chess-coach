# Cloudflare Worker that serves app/ and the /api endpoints (worker/index.js).
# Top level = local development (`npm run dev`). Deploys always name an environment:
#   npx wrangler deploy --env dev|test|production   (normally done by .github/workflows/deploy.yml)
# No secrets are needed: the Auth0 values below are public (the app shows them to every browser).
# Leave them empty and the app runs without accounts.
name = "chess-coach-local"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Bindings and vars don't inherit, so each environment lists its own.
# D1 databases without an id are created on the first deploy; the Worker creates its table.
# Auth0: one tenant (checkmateprep.us.auth0.com) with one API and two Single Page Applications:
# "Checkmate Prep" for production, "Checkmate Prep (dev)" for dev, test and local runs.
# AUTH0_DOMAIN = where sign-in happens (tokens must come from this exact domain), AUTH0_CLIENT_ID = the
# application, AUTH0_AUDIENCE = the API identifier. Locally, set them in .dev.vars.
[vars]
AUTH0_DOMAIN = ""
AUTH0_CLIENT_ID = ""
AUTH0_AUDIENCE = ""
[[d1_databases]]
binding = "DB"
[[ratelimits]]
name = "BURST"
namespace_id = "1000"
simple = { limit = 30, period = 60 }

[env.dev]
name = "chess-coach-dev"
vars = { AUTH0_DOMAIN = "", AUTH0_CLIENT_ID = "", AUTH0_AUDIENCE = "" }
d1_databases = [{ binding = "DB" }]
ratelimits = [{ name = "BURST", namespace_id = "1001", simple = { limit = 30, period = 60 } }]

[env.test]
name = "chess-coach-test"
vars = { AUTH0_DOMAIN = "", AUTH0_CLIENT_ID = "", AUTH0_AUDIENCE = "" }
d1_databases = [{ binding = "DB" }]
ratelimits = [{ name = "BURST", namespace_id = "1002", simple = { limit = 30, period = 60 } }]

# Production answers only on checkmateprep.com (www redirects to it in worker/index.js). No workers.dev
# address: the browser keeps each user's data per address, so there must be exactly one.
# Deploying creates the DNS records; the domain's zone must be in the same Cloudflare account.
[env.production]
name = "chess-coach"
workers_dev = false
routes = [{ pattern = "checkmateprep.com", custom_domain = true }, { pattern = "www.checkmateprep.com", custom_domain = true }]
vars = { AUTH0_DOMAIN = "login.checkmateprep.com", AUTH0_CLIENT_ID = "2tQ9JSSnfNd6GraU8bmoe9bQ5P64yMnm", AUTH0_AUDIENCE = "https://api.checkmateprep.com" }
d1_databases = [{ binding = "DB" }]
ratelimits = [{ name = "BURST", namespace_id = "1003", simple = { limit = 30, period = 60 } }]
